name: Molecule Test

on:
  push:
    branches:
      - "!main"
      - "!dependabot/**"
  pull_request:

jobs:
  molecule:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu2204
            image: geerlingguy/docker-ubuntu2204-ansible:latest
          # - distro: alma9
          #   image: geerlingguy/docker-almalinux9-ansible:latest
          # - distro: alma10
          #   image: geerlingguy/docker-almalinux10-ansible:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install molecule Docker driver
        run: pip install "molecule-docker<2.0.0"

      - name: Run molecule converge
        run: molecule converge
        env:
          MOLECULE_DISTRO: ${{ matrix.image }}
          HOME: ${{ runner.temp }}
          XDG_CONFIG_HOME: ${{ runner.temp }}/config

      - name: Destroy molecule instance
        run: molecule destroy
        env:
          MOLECULE_DISTRO: ${{ matrix.image }}
          HOME: ${{ runner.temp }}
          XDG_CONFIG_HOME: ${{ runner.temp }}/config
