name: Molecule Test

on:
  push:
    branches:
      - main
      - beta
      - alpha
      - "!dependabot/**"
  pull_request:

jobs:
  molecule:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu2204
            image: geerlingguy/docker-ubuntu2204-ansible:latest
          # - distro: alma9
          #   image: geerlingguy/docker-almalinux9-ansible:latest
          # - distro: alma10
          #   image: geerlingguy/docker-almalinux10-ansible:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install molecule Docker driver
        run: pip install molecule-docker

      - name: Run molecule test
        run: molecule test
        env:
          MOLECULE_DISTRO: ${{ matrix.image }}
